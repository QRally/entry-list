<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Rally Hub — Entries & Results</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap">
  <style>
    :root {
      --bg-color: #0b0f19;
      --card-bg: #151c2c;
      --border-color: #2a364f;
      --accent-color: #e11d48;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --sponsor-color: #f59e0b;
      --time-color: #10b981;
      --font-family: 'Inter', system-ui, -apple-system, sans-serif;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { background-color: var(--bg-color); color: var(--text-main); font-family: var(--font-family); padding-bottom: 50px; }

    .container { max-width: 1100px; margin: 0 auto; padding: 0 16px; }

    /* Event Header */
    .event-header { 
      text-align: center; 
      padding: 36px 16px 28px; 
      background: linear-gradient(180deg, #1e293b 0%, #0b0f19 100%); 
      border-bottom: 1px solid var(--border-color); 
    }

    h1 { font-size: 1.8rem; font-weight: 800; text-transform: uppercase; letter-spacing: 0.5px; }
    h2 { font-size: 1rem; color: var(--accent-color); font-weight: 600; text-transform: uppercase; letter-spacing: 1px; margin-top: 6px; }

    /* Control Bar Layout */
    .controls { display: flex; gap: 12px; margin: 24px 0; flex-wrap: wrap; align-items: center; }
    .controls input, .controls select { 
      background: var(--card-bg); 
      border: 1px solid var(--border-color); 
      color: var(--text-main); 
      padding: 10px 14px; 
      border-radius: 6px; 
      font-size: 0.95rem; 
      outline: none; 
      transition: border-color 0.2s;
    }
    .controls input { flex: 1; min-width: 240px; }
    .controls input:focus, .controls select:focus { border-color: var(--accent-color); }
    .stats-badge { 
      margin-left: auto; 
      background: var(--card-bg); 
      padding: 10px 16px; 
      border-radius: 6px; 
      border: 1px solid var(--border-color); 
      font-weight: 600; 
      font-size: 0.85rem; 
      color: var(--text-muted); 
    }

    /* Entry Table */
    .table-wrapper { background: var(--card-bg); border-radius: 8px; border: 1px solid var(--border-color); overflow: hidden; }
    table { width: 100%; border-collapse: collapse; text-align: left; }
    th { 
      background: #0f172a; 
      padding: 14px 16px; 
      font-size: 0.75rem; 
      text-transform: uppercase; 
      letter-spacing: 1px; 
      color: var(--text-muted); 
      border-bottom: 1px solid var(--border-color); 
    }
    td { padding: 12px 16px; border-bottom: 1px solid var(--border-color); font-size: 0.95rem; }
    tr:last-child td { border-bottom: none; }
    tr:hover { background: rgba(255,255,255,0.02); }

    .col-no { width: 110px; font-weight: 800; color: var(--accent-color); font-size: 1rem; }
    .pos-badge { background: var(--accent-color); color: #fff; padding: 2px 6px; border-radius: 4px; font-size: 0.85rem; margin-right: 6px; }
    .driver-name { font-weight: 600; display: block; color: #fff; }
    .codriver-name { font-size: 0.85rem; color: var(--text-muted); display: block; margin-top: 2px; }
    .vehicle-name { font-weight: 600; color: #e2e8f0; }
    .col-class { font-weight: 700; text-align: center; color: #cbd5e1; }
    .col-time { font-family: monospace; font-size: 1.05rem; font-weight: 700; color: var(--time-color); text-align: right; }
    .col-sponsor { color: var(--sponsor-color); font-style: italic; font-size: 0.85rem; }

    /* Mobile Responsive Card Layout */
    @media (max-width: 720px) {
      .controls {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 8px;
      }
      .controls input {
        grid-column: span 2;
        width: 100%;
      }
      .controls select {
        grid-column: span 1;
        width: 100%;
      }
      .stats-badge {
        grid-column: span 1;
        margin-left: 0;
        text-align: center;
        padding: 10px;
        display: flex;
        align-items: center;
        justify-content: center;
      }

      thead { display: none; }
      table, tbody, tr, td { display: block; width: 100%; }
      tr { margin-bottom: 12px; border: 1px solid var(--border-color); border-radius: 8px; background: var(--card-bg); padding: 12px 16px; }
      td { padding: 4px 0; border: none; text-align: left !important; }
      
      .col-no { font-size: 1rem; margin-bottom: 8px; width: 100%; display: flex; justify-content: space-between; align-items: center; }
      .col-time { font-size: 1.15rem; margin-top: 6px; margin-bottom: 4px; }
      .col-time::before { content: "Total: "; color: var(--text-muted); font-size: 0.85rem; font-weight: 400; }
      .col-cc::before { content: "CC: "; color: var(--text-muted); }
      .col-class::before { content: "Class: "; color: var(--text-muted); }
      .col-sponsor::before { content: "Sponsor: "; color: var(--text-muted); font-style: normal; }
    }
  </style>
</head>
<body>

  <header class="event-header">
    <h1 id="eventTitle">Event Organiser</h1>
    <h2 id="eventSubtitle">List of Entries</h2>
  </header>

  <main class="container">
    <section class="controls">
      <input type="text" id="searchInput" placeholder="Search driver, co-driver, vehicle, class, or sponsor...">
      <select id="classFilter">
        <option value="ALL">All Classes</option>
      </select>
      <div class="stats-badge" id="entryCount">Entries: 0</div>
    </section>

    <div class="table-wrapper">
      <table id="entryTable">
        <thead>
          <tr id="tableHeader">
            <th class="col-no">Car</th>
            <th class="col-crew">Driver / Co-Driver</th>
            <th class="col-vehicle">Vehicle</th>
            <th class="col-time" style="text-align: right;">Total Time</th>
            <th class="col-class" style="text-align: center;">Class</th>
            <th class="col-sponsor">Sponsor</th>
          </tr>
        </thead>
        <tbody id="entryListBody">
          <!-- Populated dynamically -->
        </tbody>
      </table>
    </div>
  </main>

  <script>
    let entriesData = [];

    document.addEventListener("DOMContentLoaded", () => {
      fetchEntries();

      document.getElementById("searchInput").addEventListener("input", filterEntries);
      document.getElementById("classFilter").addEventListener("change", filterEntries);
    });

    async function fetchEntries() {
      try {
        // Cache-busting URL parameter forces fresh fetch every time
        const res = await fetch("entries.json?v=" + new Date().getTime());
        const data = await res.json();
        
        if (data.entries) {
          entriesData = data.entries;
          if (data.eventTitle) document.getElementById("eventTitle").textContent = data.eventTitle;
          if (data.eventSubtitle) document.getElementById("eventSubtitle").textContent = data.eventSubtitle;
        } else {
          entriesData = data;
        }

        populateClassDropdown(entriesData);
        renderTable(entriesData);
      } catch (err) {
        console.error("Error loading JSON entries:", err);
      }
    }

    function populateClassDropdown(data) {
      const select = document.getElementById("classFilter");
      select.innerHTML = '<option value="ALL">All Classes</option>';
      const classes = [...new Set(data.map(item => item.class))].sort((a,b) => a.localeCompare(b, undefined, {numeric: true}));
      classes.forEach(c => {
        const opt = document.createElement("option");
        opt.value = c;
        opt.textContent = `Class ${c}`;
        select.appendChild(opt);
      });
    }

    function renderTable(data) {
      const tbody = document.getElementById("entryListBody");
      const countBadge = document.getElementById("entryCount");
      tbody.innerHTML = "";

      if (data.length === 0) {
        tbody.innerHTML = `<tr><td colspan="6" style="text-align:center; padding: 24px; color: var(--text-muted);">No records found.</td></tr>`;
        countBadge.textContent = "Entries: 0";
        return;
      }

      // Check if dataset contains results mode data
      const isResultsMode = data.some(item => item.pos !== undefined || item.totalTime);

      // Auto-sort by Position (if results mode) or Car Number (if entry mode)
      const sortedData = [...data].sort((a, b) => {
        if (isResultsMode && a.pos && b.pos) return a.pos - b.pos;
        return a.carNo - b.carNo;
      });

      sortedData.forEach(item => {
        const tr = document.createElement("tr");

        const posTag = item.pos ? `<span class="pos-badge">#${item.pos}</span>` : '';
        const carNoTag = `Car ${item.carNo}`;
        const timeDisplay = item.totalTime ? item.totalTime : '-';

        tr.innerHTML = `
          <td class="col-no">${posTag} ${carNoTag}</td>
          <td class="col-crew">
            <span class="driver-name">${item.driver}</span>
            <span class="codriver-name">/ ${item.coDriver}</span>
          </td>
          <td class="col-vehicle"><span class="vehicle-name">${item.vehicle}</span></td>
          <td class="col-time">${timeDisplay}</td>
          <td class="col-class">${item.class}</td>
          <td class="col-sponsor">${item.sponsor ? item.sponsor : '-'}</td>
        `;
        tbody.appendChild(tr);
      });

      countBadge.textContent = `Total: ${data.length}`;
    }

    function filterEntries() {
      const query = document.getElementById("searchInput").value.toLowerCase().trim();
      const selectedClass = document.getElementById("classFilter").value;

      const filtered = entriesData.filter(item => {
        const matchesSearch = 
          item.driver.toLowerCase().includes(query) ||
          item.coDriver.toLowerCase().includes(query) ||
          item.vehicle.toLowerCase().includes(query) ||
          (item.sponsor && item.sponsor.toLowerCase().includes(query)) ||
          item.carNo.toString() === query;

        const matchesClass = selectedClass === "ALL" || item.class.toString() === selectedClass;

        return matchesSearch && matchesClass;
      });

      renderTable(filtered);
    }
  </script>
</body>
</html>
